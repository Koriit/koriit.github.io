<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Dev Meme</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #0d1117; color: #c9d1d9;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 2rem;
    }
    .meme-card {
      max-width: 600px; width: 100%; background: #161b22;
      border: 1px solid #30363d; border-radius: 8px; overflow: hidden;
    }
    .meme-header {
      padding: 1rem 1.25rem; border-bottom: 1px solid #30363d;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .meme-title { font-size: 0.85rem; font-weight: 700; line-height: 1.4; flex: 1; }
    .meme-meta { font-size: 0.7rem; color: #8b949e; white-space: nowrap; }
    .meme-img-wrap {
      position: relative; min-height: 200px; display: flex;
      align-items: center; justify-content: center; background: #0d1117;
    }
    .meme-img-wrap img { display: block; width: 100%; height: auto; }
    .meme-footer {
      padding: 0.75rem 1.25rem; border-top: 1px solid #30363d;
      display: flex; align-items: center; justify-content: space-between;
    }
    button {
      font-family: inherit; font-size: 0.8rem; font-weight: 700;
      padding: 0.5rem 1.25rem; border: 1px solid #58a6ff; border-radius: 6px;
      background: transparent; color: #58a6ff; cursor: pointer; transition: all 0.15s;
    }
    button:hover { background: #58a6ff; color: #0d1117; }
    button:disabled { opacity: 0.4; cursor: wait; }
    .source-link { font-size: 0.7rem; color: #8b949e; text-decoration: none; }
    .source-link:hover { color: #58a6ff; }
    .spinner {
      width: 28px; height: 28px; border: 3px solid #30363d;
      border-top-color: #58a6ff; border-radius: 50%; animation: spin .6s linear infinite;
    }
    .error-msg { padding: 2rem; text-align: center; color: #f85149; font-size: 0.8rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="meme-card">
  <div class="meme-header">
    <span class="meme-title" id="title">Loading…</span>
    <span class="meme-meta" id="meta"></span>
  </div>
  <div class="meme-img-wrap" id="imageWrap">
    <div class="spinner"></div>
  </div>
  <div class="meme-footer">
    <button id="btn" onclick="showNext()" disabled>Next meme</button>
    <a class="source-link" id="postLink" href="#" target="_blank" rel="noopener">view on reddit ↗</a>
  </div>
</div>

<script>
  const $title = document.getElementById('title');
  const $meta  = document.getElementById('meta');
  const $wrap  = document.getElementById('imageWrap');
  const $btn   = document.getElementById('btn');
  const $link  = document.getElementById('postLink');

  let pool = [];
  let poolIdx = 0;
  let redditAfter = '';

  // ── Fetch a batch of image posts from r/ProgrammerHumor ──────────
  async function fetchPool() {
    const url =
      `https://www.reddit.com/r/ProgrammerHumor/hot.json?limit=50&raw_json=1` +
      (redditAfter ? `&after=${redditAfter}` : '');

    const res = await fetch(url, {
      headers: { 'Accept': 'application/json' }
    });
    if (!res.ok) throw new Error(`Reddit returned ${res.status}`);
    const json = await res.json();
    redditAfter = json.data.after || '';

    const posts = json.data.children
      .map(c => c.data)
      .filter(d =>
        !d.over_18 &&
        !d.is_video &&
        d.post_hint === 'image' &&
        /\.(jpg|jpeg|png|gif|webp)(\?.*)?$/i.test(d.url)
      )
      .map(d => ({
        title:    d.title,
        url:      d.url,
        ups:      d.ups,
        postLink: `https://reddit.com${d.permalink}`,
        sub:      d.subreddit,
      }));

    // shuffle
    for (let i = posts.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [posts[i], posts[j]] = [posts[j], posts[i]];
    }
    return posts;
  }

  // ── Display one meme ────────────────────────────────────────────
  function renderMeme(meme) {
    $title.textContent = meme.title;
    $meta.textContent  = `r/${meme.sub} · ⬆ ${meme.ups}`;
    $link.href = meme.postLink;

    const img = new Image();
    img.alt = meme.title;
    img.onload = () => {
      $wrap.innerHTML = '';
      $wrap.appendChild(img);
      $btn.disabled = false;
    };
    img.onerror = () => showNext(); // skip broken images
    img.src = meme.url;
  }

  // ── Next ────────────────────────────────────────────────────────
  async function showNext() {
    $btn.disabled = true;
    $wrap.innerHTML = '<div class="spinner"></div>';
    try {
      if (poolIdx >= pool.length) {
        pool = await fetchPool();
        poolIdx = 0;
      }
      if (!pool.length) throw new Error('No image posts found');
      renderMeme(pool[poolIdx++]);
    } catch (err) {
      $wrap.innerHTML = `<div class="error-msg">${err.message}</div>`;
      $title.textContent = 'Error';
      $btn.disabled = false;
    }
  }

  showNext();
</script>

</body>
</html>
